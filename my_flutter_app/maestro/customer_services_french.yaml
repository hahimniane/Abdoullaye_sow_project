appId: com.laawoldigital.app
name: Customer service hub renders in French
---
- launchApp
- extendedWaitUntil:
    visible: "(?s).*E2E Customer.*"
    timeout: 30000
- runFlow:
    when:
      visible: "Paramètres"
    commands:
      - tapOn: "Paramètres"
      - tapOn: "Français"
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
- extendedWaitUntil:
    visible: "(?s).*Favorite cars.*"
    timeout: 20000
- tapOn: "English"
- tapOn: "Expédition"
- assertVisible: "(?s).*Envoyer un baril.*"
- assertVisible: "(?s).*Barils partagés.*"
- assertVisible: "(?s).*Fret.*"
- assertVisible: "(?s).*Transporter une voiture.*"
- takeScreenshot: "output/ios-e2e/services-hub-fr"
- tapOn: "(?s).*Envoyer un baril.*"
- extendedWaitUntil:
    visible: "(?s).*Envoyer des barils.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Ajouter une destination"
    direction: DOWN
- assertVisible: "Destinations"
- tapOn: "Ajouter une destination"
- assertVisible: "Destination 1"
- scrollUntilVisible:
    element:
      text: "Ajouter à la commande"
    direction: DOWN
- assertVisible: "Ajouter à la commande"
- takeScreenshot: "output/ios-e2e/send-barrel-fr"
