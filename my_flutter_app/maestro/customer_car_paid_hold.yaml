appId: com.laawoldigital.app
name: Customer places a paid hold on a listed car
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "(?s).*Sign in to your wallet.*"
    timeout: 20000
- tapOn: "(?s).*Sign in to your wallet.*"
- extendedWaitUntil:
    visible: "Account Login"
    timeout: 20000
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: "e2e.customer@laawol.test"
- tapOn: "Password"
- inputText: "${E2E_TEST_PASSWORD}"
- tapOn: "done"
- scrollUntilVisible:
    element:
      text: "Sign In"
    direction: DOWN
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "(?s).*E2E Customer.*"
    timeout: 30000
- tapOn: "Cars"
- tapOn: "(?s).*Browse cars.*"
- scrollUntilVisible:
    element:
      text: "(?s).*2021 Honda CR-V EX.*"
    direction: DOWN
- tapOn: "(?s).*2021 Honda CR-V EX.*"
- scrollUntilVisible:
    element:
      text: "Reserve with paid hold"
    direction: DOWN
- tapOn: "Reserve with paid hold"
- scrollUntilVisible:
    element:
      text: "Continue to payment"
    direction: DOWN
- tapOn: "Continue to payment"
- extendedWaitUntil:
    visible: "Reserve this car?"
    timeout: 10000
- tapOn: "Continue to payment"
- extendedWaitUntil:
    visible: "(?s).*Deposit received. Your reservation is now active.*"
    timeout: 30000
- takeScreenshot: "output/ios-e2e/car-paid-hold"
