appId: com.laawoldigital.app
name: Customer joins an open shared barrel
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "(?s).*Sign in to your wallet.*"
    timeout: 20000
- tapOn: "(?s).*Sign in to your wallet.*"
- extendedWaitUntil:
    visible: "Account Login"
    timeout: 20000
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: "e2e.customer.b@laawol.test"
- tapOn: "done"
- tapOn: "Password"
- inputText: "${E2E_TEST_PASSWORD}"
- tapOn: "done"
- scrollUntilVisible:
    element:
      text: "Sign In"
    direction: DOWN
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "(?s).*E2E Customer B.*"
    timeout: 30000
- tapOn: "Shipping"
- tapOn: "(?s).*Shared barrels.*"
- extendedWaitUntil:
    visible: "Request one share"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Request one share"
      below: "1/2"
    direction: DOWN
- tapOn:
    text: "Request one share"
    below: "1/2"
- tapOn: "Sender name"
- inputText: "E2E Customer B"
- tapOn: "Receiver name"
- inputText: "Mamadou Bah"
- tapOn: "Receiver phone"
- inputText: "+224620000099"
- scrollUntilVisible:
    element:
      text: "What are you sending?"
    direction: DOWN
- tapOn: "What are you sending?"
- inputText: "Clothes and shoes"
- scrollUntilVisible:
    element:
      text: "I confirm the contents and estimated weight are accurate."
    direction: DOWN
- tapOn: "I confirm the contents and estimated weight are accurate."
- tapOn: "I confirm there are no prohibited or unsafe items."
- scrollUntilVisible:
    element:
      text: "I understand one bad item can delay the shared barrel."
    direction: DOWN
- tapOn: "I understand one bad item can delay the shared barrel."
- scrollUntilVisible:
    element:
      text: "Send request"
    direction: DOWN
- tapOn: "Send request"
- extendedWaitUntil:
    visible: "I understand the business’s responsibility and want to continue."
    timeout: 10000
- tapOn: "I understand the business’s responsibility and want to continue."
- tapOn: "Continue to payment"
- extendedWaitUntil:
    visible: "(?s).*Join request sent.*"
    timeout: 30000
- takeScreenshot: "output/ios-e2e/shared-barrel-joined"
