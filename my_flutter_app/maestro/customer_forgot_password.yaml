appId: com.laawoldigital.app
name: Customer opens forgot password from the nested wallet login
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "(?s).*Sign in to your wallet.*"
    timeout: 30000
- tapOn:
    point: 50%, 22%
- extendedWaitUntil:
    visible: "Account Login"
    timeout: 20000
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Forgot Password?"
    direction: DOWN
- tapOn: "Forgot Password?"
- extendedWaitUntil:
    visible: "Reset Password"
    timeout: 20000
- assertVisible: "Email"
- takeScreenshot: "output/ios-e2e/forgot-password-native"
