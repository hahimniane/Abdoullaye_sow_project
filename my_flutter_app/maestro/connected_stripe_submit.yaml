appId: com.laawoldigital.app
name: Submit the filled Stripe test PaymentSheet
---
- tapOn:
    point: 90%,62%
- tapOn: "(?s).*Pay.*22,950.*"
- extendedWaitUntil:
    visible: "(?s).*Payment received. This car is now purchased.*"
    timeout: 60000
- takeScreenshot: "output/ios-e2e/connected-stripe-car-purchased"
