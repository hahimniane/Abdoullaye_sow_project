appId: com.laawoldigital.app
name: Customer purchases a listed car
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "(?s).*Sign in to your wallet.*"
    timeout: 20000
- tapOn: "(?s).*Sign in to your wallet.*"
- extendedWaitUntil:
    visible: "Account Login"
    timeout: 20000
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: "e2e.customer@laawol.test"
- tapOn: "Password"
- inputText: "${E2E_TEST_PASSWORD}"
- tapOn: "done"
- scrollUntilVisible:
    element:
      text: "Sign In"
    direction: DOWN
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "(?s).*E2E Customer.*"
    timeout: 30000
- tapOn: "Cars"
- tapOn: "(?s).*Browse cars.*"
- scrollUntilVisible:
    element:
      text: "(?s).*2022 Nissan Rogue SV.*"
    direction: DOWN
- tapOn: "(?s).*2022 Nissan Rogue SV.*"
- scrollUntilVisible:
    element:
      text: "Purchase this car"
    direction: DOWN
- tapOn: "Purchase this car"
- extendedWaitUntil:
    visible: "Pay Now"
    timeout: 20000
- tapOn: "Pay Now"
- extendedWaitUntil:
    visible: "Purchase this car?"
    timeout: 10000
- tapOn: "Continue to payment"
- extendedWaitUntil:
    visible: "(?s).*Payment received. This car is now purchased.*"
    timeout: 30000
- takeScreenshot: "output/ios-e2e/car-purchased"
