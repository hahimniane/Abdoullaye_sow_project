appId: com.laawoldigital.app
name: Customer opens a shared barrel pool
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "(?s).*Sign in to your wallet.*"
    timeout: 30000
- tapOn: "(?s).*Sign in to your wallet.*"
- extendedWaitUntil:
    visible: "Account Login"
    timeout: 20000
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: "e2e.customer@laawol.test"
- tapOn: "Password"
- inputText: "${E2E_TEST_PASSWORD}"
- tapOn: "done"
- scrollUntilVisible:
    element:
      text: "Sign In"
    direction: DOWN
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "(?s).*E2E Customer.*"
    timeout: 30000
- tapOn: "Shipping"
- tapOn: "(?s).*Shared barrels.*"
- extendedWaitUntil:
    visible: "Post partial barrel"
    timeout: 30000
- tapOn: "Post partial barrel"
- extendedWaitUntil:
    visible: "Sender name"
    timeout: 20000
- tapOn: "Sender name"
- inputText: "E2E Customer"
- tapOn: "Receiver name"
- inputText: "Mamadou Bah"
- tapOn: "Receiver phone"
- inputText: "+224620000101"
- scrollUntilVisible:
    element:
      text: "What are you sending?"
    direction: DOWN
- tapOn: "What are you sending?"
- inputText: "Clothes and household goods"
- scrollUntilVisible:
    element:
      text: "I confirm the contents and estimated weight are accurate."
    direction: DOWN
- tapOn: "I confirm the contents and estimated weight are accurate."
- tapOn: "I confirm there are no prohibited or unsafe items."
- scrollUntilVisible:
    element:
      text: "I understand one bad item can delay the shared barrel."
    direction: DOWN
- tapOn: "I understand one bad item can delay the shared barrel."
- scrollUntilVisible:
    element:
      text: "Post barrel"
    direction: DOWN
- tapOn: "Post barrel"
- extendedWaitUntil:
    visible: "I understand the business’s responsibility and want to continue."
    timeout: 10000
- tapOn: "I understand the business’s responsibility and want to continue."
- tapOn: "Continue to payment"
- extendedWaitUntil:
    visible: "(?s).*Shared barrel posted.*Deposit.*"
    timeout: 30000
- takeScreenshot: "output/ios-e2e/shared-barrel-opened"
